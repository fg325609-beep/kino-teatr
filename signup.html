<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KinoHub | Ro‘yxatdan o‘tish</title>
  <meta name="description" content="Ro‘yxatdan o‘tish sahifasi." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <span class="logo" aria-hidden="true"></span>
        <span>KinoHub</span>
      </a>
      <nav class="menu" aria-label="Menu">
        <a href="catalog.html">Katalog</a>
        <a href="signup.html">Ro‘yxatdan o‘tish</a>
      </nav>
      <a class="btn secondary" href="index.html">Asosiy</a>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="card" style="max-width:520px; margin:0 auto">
        <div class="pill"><span class="dot"></span> Account yaratish</div>
        <h1 style="margin-top:12px">Ro‘yxatdan o‘ting</h1>
        <p class="help">Bu demo. Keyin backend ulab login qilamiz.</p>

        <form id="signupForm" class="form">
          <input class="input" name="name" placeholder="Ism" required />
          <input class="input" name="email" placeholder="Email" required />
          <input class="input" name="password" placeholder="Parol (min 6)" type="password" required />
          <button class="btn" type="submit">Yaratish</button>
        </form>

        <div id="toast" class="toast"></div>

        <div class="hr"></div>
        <div class="help">Keyingi bosqich: login, profil, sevimlilarni serverda saqlash.</div>
      </div>
    </section>

    <footer class="footer">
      <div class="hr"></div>
      <div>© <span id="year"></span> KinoHub.</div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
